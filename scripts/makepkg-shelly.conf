# Preserve the Arch build host's normal compiler, archive, and signing policy.
source /etc/makepkg.conf

# Include administrator-supplied system fragments, matching makepkg's normal
# configuration loading order before enforcing Devario's package-manager rule.
if [[ -d /etc/makepkg.conf.d ]] \
  && compgen -G '/etc/makepkg.conf.d/*.conf' >/dev/null; then
  for devario_makepkg_fragment in /etc/makepkg.conf.d/*.conf; do
    source "$devario_makepkg_fragment"
  done
  unset devario_makepkg_fragment
fi

# Automatic library dependencies ask the configured package-manager hook to
# resolve `-T` queries. Devario resolves dependencies with Shelly before the
# build, so makepkg is limited to archive construction and .BUILDINFO output.
OPTIONS+=('!autodeps')
