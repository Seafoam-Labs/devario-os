search --no-floppy --set=devario_img_dev --file "${iso_path}"
probe --set devario_img_dev_uuid --fs-uuid "${devario_img_dev}"

if [ "${grub_platform}" = 'efi' ]; then
    devario_platform='UEFI'
elif [ "${grub_platform}" = 'pc' ]; then
    devario_platform='BIOS'
else
    devario_platform="${grub_cpu}-${grub_platform}"
fi

default=devario
timeout=10
timeout_style=menu

menuentry "Start Devario live environment (%ARCH%, ${devario_platform})" --class gnu-linux --class gnu --class os --id 'devario' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts root=live:UUID=%DEVARIO_UUID% rd.live.dir=%INSTALL_DIR%/%ARCH% rd.live.squashimg=airootfs.sfs rd.overlay=1 iso-scan/filename="${iso_path}"
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
}

menuentry 'System shutdown' {
    halt
}

menuentry 'System restart' {
    reboot
}
