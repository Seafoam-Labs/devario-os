LABEL devario_nbd
TEXT HELP
Boot the Devario live environment over NBD.
ENDTEXT
MENU LABEL Devario live environment (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-devario
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-devario.img
APPEND root=live:/dev/nbd0 netroot=nbd:${pxeserver}:devario rd.live.dir=%INSTALL_DIR%/%ARCH% rd.live.squashimg=airootfs.sfs rd.overlay=1 ip=dhcp rd.neednet=1 rd.devario.verify=1
SYSAPPEND 3

