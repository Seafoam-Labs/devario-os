[options]
DBPath = /var/lib/shelly/
CacheDir = /var/cache/shelly/pkg/
LogFile = /var/log/shelly.log
GPGDir = /etc/shelly.d/gnupg/
HookDirMode = Replace
HookDir = /usr/share/rlpm/hooks/
HookDir = /etc/shelly.d/hooks/
HoldPkg = shelly glibc
Architecture = auto
CheckSpace
ParallelDownloads = 100
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[devario-core]
SigLevel = @DEVARIO_CORE_RUNTIME_SIGLEVEL@
Server = @DEVARIO_CORE_RUNTIME_REPO@

[devario-browser]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-browser/$arch

[devario-development]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-development/$arch

[devario-entertainment]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-entertainment/$arch

[devario-gaming]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-gaming/$arch

[devario-utilities]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-utilities/$arch

[devario-productivity]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-productivity/$arch

[devario-libs]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-libs/$arch

@DEVARIO_MANAGED_RUNTIME_REPOSITORY@
