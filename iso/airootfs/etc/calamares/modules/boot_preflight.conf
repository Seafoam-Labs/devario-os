---
dontChroot: true
timeout: 30
verbose: true
script:
  - "/bin/sh -c 'test -d /sys/firmware/efi && grep -qx 64 /sys/firmware/efi/fw_platform_size || { echo \"Devario installation requires 64-bit UEFI. Reboot this USB using its UEFI boot entry before installing.\" >&2; exit 1; }'"
i18n:
  name: "Checking UEFI installation support"
