---
defaultGroups:
  - wheel
  - audio
  - video
  - storage
  - network
  - lp
  - rfkill
  - autologin
doAutologin: false
autologinGroup: autologin
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
allowWeakPasswords: false
allowWeakPasswordsDefault: false
passwordRequirements:
  minLength: 8
user:
  shell: /usr/bin/fish
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "devario"
  forbidden_names: [ localhost ]
