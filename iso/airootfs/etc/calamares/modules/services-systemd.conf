---
units:
  - name: devario-gpu-hotplug.service
    action: enable
    mandatory: true
  - name: ufw.service
    action: enable
    mandatory: true
  - name: NetworkManager.service
    action: enable
    mandatory: true
  - name: bluetooth.service
    action: enable
    mandatory: true
  - name: pearl-greeter.service
    action: enable
    mandatory: true
  - name: upower.service
    action: enable
    mandatory: true
  - name: scx.service
    action: enable
    mandatory: true
  - name: power-profiles-daemon.service
    action: enable
    mandatory: true
  - name: systemd-timesyncd.service
    action: enable
    mandatory: false
  - name: fstrim.timer
    action: enable
    mandatory: false
  - name: shelly-keyring-init.service
    action: enable
    mandatory: true
