---
# The wrapper supplies live DNS and enters the target chroot itself. Package
# operations, NVIDIA verification and boot hooks all run inside that chroot.
dontChroot: true
timeout: 14400
# Preserve the helper's failure summary and log tail in the error dialog.
verbose: false
script:
  - '/usr/lib/devario/update-target-packages --target "${ROOT}"'
i18n:
  name: "Synchronizing Shelly repositories and updating the installed system"
