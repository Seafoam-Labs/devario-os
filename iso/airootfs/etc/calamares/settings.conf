---
modules-search: [ local ]

instances:
  - id: boot_preflight
    module: shellprocess
    config: boot_preflight.conf
  - id: nvidia_preflight
    module: shellprocess
    config: nvidia_preflight.conf
  - id: nvidia
    module: shellprocess
    config: nvidia.conf
  - id: prepare_target
    module: shellprocess
    config: prepare_target.conf
  - id: systemd_boot
    module: shellprocess
    config: systemd_boot.conf
  - id: update_preflight
    module: shellprocess
    config: update_preflight.conf
  - id: update_target
    module: shellprocess
    config: update_target.conf
  - id: keyboard_aqueous
    module: shellprocess
    config: keyboard_aqueous.conf
  - id: shelly_tray
    module: shellprocess
    config: shelly_tray.conf
  - id: check_locales
    module: shellprocess
    config: check_locales.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - shellprocess@boot_preflight
      - shellprocess@nvidia_preflight
      - shellprocess@update_preflight
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@check_locales
      - shellprocess@prepare_target
      - users
      - networkcfg
      - shellprocess@nvidia
      - hwclock
      - shellprocess@systemd_boot
      - services-systemd
      - shellprocess@update_target
      - shellprocess@keyboard_aqueous
      - shellprocess@shelly_tray
      - umount
  - show:
      - finished

branding: devario
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
