name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-release-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg jq libarchive-tools python3-jsonschema python3-yaml qemu-system-x86 qemu-utils squashfs-tools xz-utils zstd
      - name: Validate source tree
        run: ./scripts/validate.sh
      - name: Run release contract tests
        run: |
          ./tests/test-release-metadata.sh
          ./tests/test-candidate-lock.sh
          ./tests/test-reproducibility.sh
          ./tests/test-acceptance-self-check.sh
          ./tests/test-image-boot-harness.sh
          ./tests/test-promotion-acceptance.sh
          ./tests/test-final-approval.sh
          ./tests/test-promotion.sh
          ./tests/test-managed-action-contract.sh
      - name: Enforce immutable action references
        run: |
          while IFS= read -r action_use; do
            action_ref="${action_use##*@}"
            if [[ "$action_use" != uses:*./* && ! "$action_ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "GitHub Action is not pinned to a full commit ID: $action_use" >&2
              exit 1
            fi
          done < <(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github)
