hostonly="yes"
hostonly_mode="sloppy"
hostonly_cmdline="no"
early_microcode="yes"
compress="xz"
add_dracutmodules+=" systemd systemd-initrd systemd-cryptsetup i18n crypt dm lvm btrfs resume "
filesystems+=" btrfs ext4 xfs f2fs vfat "
omit_dracutmodules+=" devario-live dmsquash-live dmsquash-live-autooverlay livenet nfs nbd "
# The boot entry supplies root/subvolume arguments; systemd-cryptsetup reads target crypttab.
install_optional_items+=" /etc/crypttab /etc/vconsole.conf "
