#
# /etc/pacman.conf
#
# Shelly uses its native RLPM backend and keeps mutable state under
# Shelly-owned paths. Devario supplies repository and runtime policy.

[options]
#RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /usr/share/libalpm/hooks/
HookDir     = /etc/pacman.d/hooks/
HoldPkg     = shelly glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[devario-core]
SigLevel = Required
Server = https://repo.seafoam-labs.org/devario-core/$arch
