#
# /etc/shelly.conf
#
# Shelly uses its native RLPM backend and keeps mutable state under
# Shelly-owned paths. Devario supplies repository and runtime policy.

[options]
#RootDir     = /
DBPath      = /var/lib/shelly/
CacheDir    = /var/cache/shelly/pkg/
LogFile     = /var/log/shelly.log
GPGDir      = /etc/shelly.d/gnupg/
HookDirMode = Replace
HookDir     = /usr/share/rlpm/hooks/
HookDir     = /etc/shelly.d/hooks/
HoldPkg     = shelly glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = shelly-downloader

# Post-upgrade restarts for services using replaced libraries.
# automatic (default): restart safe affected services.
# report: list affected services without restarting them.
# Session-critical units (system bus, logind, journald, udevd, display
# managers, greeters, getty@*, user@*) are reported instead of restarted.
RestartPolicy = automatic

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[devario-core]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-core/$arch

[devario-browser]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-browser/$arch

[devario-development]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-development/$arch

[devario-entertainment]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-entertainment/$arch

[devario-gaming]
SigLevel = Required
Server = https://mirrors.seafoam-labs.org/devario-gaming/$arch

[devario-utilities]
SigLevel = Required
