#
# /etc/shelly.conf
#
# Shelly uses its native RLPM backend and keeps mutable state under
# Shelly-owned paths. Devario supplies repository and runtime policy.

[options]
#RootDir     = /
DBPath      = /var/lib/shelly/
CacheDir    = /var/cache/shelly/pkg/
LogFile     = /var/log/shelly.log
GPGDir      = /etc/shelly.d/gnupg/
HookDir     = /usr/share/libalpm/hooks/
HookDir     = /etc/shelly.d/hooks/
HoldPkg     = shelly glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[devario-core]
SigLevel = Required
Server = https://repo.seafoam-labs.org/devario-core/$arch

[seafoam-labs]
SigLevel = Required
Server = https://repo.seafoam-labs.org/$arch
