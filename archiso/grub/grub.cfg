insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

if [ "${grub_platform}" = 'efi' ]; then
    devario_platform='UEFI'
elif [ "${grub_platform}" = 'pc' ]; then
    devario_platform='BIOS'
else
    devario_platform="${grub_cpu}-${grub_platform}"
fi

default=devario
timeout=10
timeout_style=menu

menuentry "Start Devario live environment (%ARCH%, ${devario_platform})" --class gnu-linux --class gnu --class os --id 'devario' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts root=live:UUID=%ARCHISO_UUID% rd.live.dir=%INSTALL_DIR%/%ARCH% rd.live.squashimg=airootfs.sfs rd.overlay=1
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
}

if [ "${grub_platform}" = 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' {
    halt
}

menuentry 'System restart' {
    reboot
}
