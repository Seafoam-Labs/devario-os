---
modules-search: [ local ]

instances:
  - id: prepare_target
    module: shellprocess
    config: prepare_target.conf
  - id: limine
    module: shellprocess
    config: limine.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@prepare_target
      - initcpiocfg
      - initcpio
      - users
      - networkcfg
      - hwclock
      - shellprocess@limine
      - services-systemd
      - umount
  - show:
      - finished

branding: devario
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
