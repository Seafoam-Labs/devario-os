[options]
DBPath = /var/lib/shelly/
CacheDir = /var/cache/shelly/pkg/
LogFile = /var/log/shelly.log
GPGDir = /etc/shelly.d/gnupg/
HookDir = /usr/share/libalpm/hooks/
HookDir = /etc/shelly.d/hooks/
HoldPkg = shelly devario-alpm-runtime glibc
Architecture = auto
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[devario-core]
# Build-time bootstrap only. Release artifacts are verified by build-iso.sh
# against the bundled Devario key before mkarchiso consumes this local copy.
SigLevel = Never
Server = file://@DEVARIO_CORE_REPO@

@DEVARIO_MANAGED_BUILD_REPOSITORY@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
