LABEL devario
TEXT HELP
Boot the Devario live environment and graphical installer.
ENDTEXT
MENU LABEL Start Devario live environment (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND root=live:UUID=%ARCHISO_UUID% rd.live.dir=%INSTALL_DIR%/%ARCH% rd.live.squashimg=airootfs.sfs rd.overlay=1
