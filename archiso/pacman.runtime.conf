[options]
HoldPkg = shelly devario-alpm-runtime glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[devario-core]
SigLevel = @DEVARIO_CORE_RUNTIME_SIGLEVEL@
Server = @DEVARIO_CORE_RUNTIME_REPO@

@DEVARIO_MANAGED_RUNTIME_REPOSITORY@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
